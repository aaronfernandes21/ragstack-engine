spring.application.name=aiDoc

jwt.secret=${JWT_SECRET}
#jwt.secret=NAkii7N01SwtSyUtqZLsHLyXeJipjhJsd0rkO9uOuB8
spring.datasource.url=${SPRING_DATASOURCE_URL}
#spring.datasource.url=jdbc:postgresql://localhost:5433/app_db
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
#spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
#spring.datasource.password=password
spring.jpa.properties.hibernate.default_schema=auth

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS}
#spring.kafka.bootstrap-servers=kafka:9092

spring.kafka.consumer.group-id=ai-doc-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# ? CRITICAL (otherwise deserialization fails)
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# ? VERY IMPORTANT (tells Kafka what object to map to)
spring.kafka.consumer.properties.spring.json.value.default.type=com.aaron.aiDoc.Kafka.DocumentEvent

#embedding.api.url=${EMBEDDING_URL}
embedding.model=nomic-embed-text
#embedding.api.url=http://ollama:11434/api/embeddings
spring.ai.ollama.base-url=${SPRING_AI_OLLAMA_BASE_URL}
#spring.ai.ollama.base-url=http://ollama:11434
spring.ai.ollama.chat.options.model=phi3:mini
spring.ai.ollama.chat.options.temperature=0.2